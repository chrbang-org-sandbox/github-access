# Desired access state for chrbang-org-sandbox. Source of truth. Changed via PR; applied with tools/apply.py.
# Generated by tools/restructure.py from snapshot 2026-09-22T101204Z (activity window 365 days) and clients.yaml.
# Model: everyone has read via base permission. Admin only via one team per customer (name = full customer name) on the customer's active repos, and the internal team on internal repos.
# Dormant repos (no push in the window) have no write grants. Direct collaborators only for external people.
org: chrbang-org-sandbox
base_permission: read
owners:
- chrbang

teams:
  developers:
    description: All developers. Read only (via base permission); write is granted per customer in customer teams.
    privacy: secret
    members: []

  kunde-a:
    name: Kunde A
    description: Kunde A
    maintainers:
    - chrbang
    members:
    - AdrianGrotter
    - KennethHoff
    repos:
      admin:
      - repository-1
      - repository-2

  kunde-b:
    name: Kunde B
    description: Kunde B
    members:
    - chrbang
    repos:
      admin:
      - repository-3

  kunde-c:
    name: Kunde C
    description: Kunde C
    members:
    - chrbang
    - pedarn
    repos:
      admin:
      - repository-4
      - repository-6

  platform:
    name: Platform
    description: Owns access management. Approves and merges PRs in github-access.
    members:
    - AdrianGrotter
    - chrbang  # owner, implicit maintainer
    repos:
      write:
      - github-access

  internal:
    name: Internal
    description: 'Internal repos: packages, tools, experiments.'
    members: []
    repos:
      admin:
      - repository-5

# Direct collaborators: external people only (outside collaborators). Employees get access via teams.
repos: {}

