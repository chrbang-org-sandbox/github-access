# Generert av tools/gen-issue-form.py. Team fra access.yaml, brukere fra orgen (--users). Ikke rediger for hånd.
name: Be om tilgang til et team
description: Legg deg selv eller kolleger til i et team, eller fjern. Lager en pull request som platform-teamet godkjenner.
title: Tilgangsforespørsel
labels:
- access-request
body:
- type: markdown
  attributes:
    value: 'Når du sender inn, lages en pull request mot `access.yaml` automatisk. Når den er godkjent og merget, oppdateres
      tilgangen i GitHub av seg selv. Se FLYT.md for detaljer.


      La tittelen stå. Den settes automatisk ut fra valgene under.'
- type: dropdown
  id: action
  attributes:
    label: Hva
    options:
    - Legg til
    - Fjern
  validations:
    required: true
- type: dropdown
  id: team
  attributes:
    label: Team
    options:
    - Internal (internal)
    - Kunde A (kunde-a)
    - Kunde B (kunde-b)
    - Kunde C (kunde-c)
    - Platform (platform)
  validations:
    required: true
- type: dropdown
  id: who
  attributes:
    label: Hvem
    description: Deg selv er forhåndsvalgt. Velg flere for å be på vegne av kolleger.
    multiple: true
    options:
    - Meg selv (den som sender inn)
    - AdrianGrotter
    - chrbang
    - KennethHoff
    - pedarn
    default: 0
- type: input
  id: others
  attributes:
    label: Andre brukernavn
    description: Kun for folk som ikke står i lista over, f.eks. nyinviterte. Kommaseparert.
    placeholder: f.eks. octocat, monalisa
- type: textarea
  id: reason
  attributes:
    label: Begrunnelse
    description: Hvilket prosjekt, fra når, hvor lenge.
  validations:
    required: true
