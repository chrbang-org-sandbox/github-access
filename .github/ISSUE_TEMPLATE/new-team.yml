# Generated by tools/gen-issue-form.py. Teams from access.yaml, users from the org (--users). Do not edit by hand.
name: Request a new team
description: A new customer that has no team yet. Creates a pull request that adds the team and its repos.
title: New team
labels:
- new-team
body:
- type: markdown
  attributes:
    value: 'One team per customer, with admin on the customer''s repos. The team name is the full customer name; GitHub derives
      the slug from it ("Kunde AS" → `kunde-as`). Once the PR is approved and merged, the team exists and members can be added
      with the "Request team access" form.


      Leave the title as is.'
- type: input
  id: name
  attributes:
    label: Customer name
    description: Full name, capitalised. Becomes the team name.
    placeholder: e.g. Kunde AS
  validations:
    required: true
- type: input
  id: repos
  attributes:
    label: Repos
    description: Repo names or globs, comma-separated. A glob covers repos created later too.
    placeholder: e.g. Kunde.*, kunde-website
  validations:
    required: true
- type: dropdown
  id: who
  attributes:
    label: Members
    description: Initial members. Leave empty to add people later with the access form.
    multiple: true
    options:
    - Myself (the requester)
    - AdrianGrotter
    - chrbang
    - KennethHoff
    - pedarn
- type: textarea
  id: reason
  attributes:
    label: Reason
    description: Which project, who is the tech lead.
  validations:
    required: true
