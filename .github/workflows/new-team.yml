# New team (issue form) -> pull request that adds the customer to clients.yaml and the team to access.yaml.
# Runs with a short-lived GitHub App token. Can only create a branch, PR and comment. Cannot change access.
name: New team → PR
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: new-team-${{ github.event.issue.number }}
jobs:
  pr:
    if: contains(github.event.issue.labels.*.name, 'new-team')
    runs-on: ubuntu-latest
    environment: github-app
    env:
      ORG: ${{ github.repository_owner }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }   # otherwise GITHUB_TOKEN overrides the App token on push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml

      - name: Read the form
        id: form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e; out=$(tools/parse-new-team.py 2>&1); rc=$?; set -e
          if [ $rc -ne 0 ]; then gh issue comment "$ISSUE" --body "❌ Could not read the request: $out"; exit 1; fi
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

      - name: Set the issue title from the choices
        env: { GH_TOKEN: "${{ github.token }}", TITLE: "${{ steps.form.outputs.title }}" }
        run: gh issue edit "$ISSUE" --title "$TITLE"

      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ secrets.ACCESS_APP_ID }}
          private-key: ${{ secrets.ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check that the members are in the org, and fetch the repo list
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}", LOGINS: "${{ steps.form.outputs.logins }}" }
        run: |
          missing=""
          for l in $LOGINS; do gh api "orgs/$ORG/members/$l" --silent 2>/dev/null || missing="$missing \`$l\`"; done
          if [ -n "$missing" ]; then
            gh issue comment "$ISSUE" --body "❌ Not a member of the org \`$ORG\`:$missing. The person must be invited first. No PR created."
            exit 1
          fi
          gh api "orgs/$ORG/repos" --paginate --jq '.[].name' > repos.txt

      - name: Update access.yaml and clients.yaml
        id: edit
        env:
          NAME: ${{ steps.form.outputs.name }}
          GLOBS: ${{ steps.form.outputs.globs }}
          LOGINS: ${{ steps.form.outputs.logins }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          args=(); for g in $GLOBS; do args+=(--glob "$g"); done; for l in $LOGINS; do args+=(--login "$l"); done
          set +e; summary=$(tools/new-team.py --name "$NAME" "${args[@]}" --repos repos.txt 2>&1); rc=$?; set -e
          if [ $rc -ne 0 ]; then gh issue comment "$ISSUE" --body "❌ Could not make the change: $summary"; exit 1; fi
          tools/gen-issue-form.py
          { echo "summary<<EOS"; printf '%s\n' "$summary"; echo "EOS"; } >> "$GITHUB_OUTPUT"

      - name: Branch, commit and pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SUMMARY: ${{ steps.edit.outputs.summary }}
          TITLE: ${{ steps.form.outputs.title }}
          REASON: ${{ steps.form.outputs.reason }}
          SLUG: ${{ steps.form.outputs.slug }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_ID: ${{ github.event.issue.user.id }}
        run: |
          git config user.name "github-access[bot]"
          git config user.email "github-access[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BR="new-team/${SLUG}-${ISSUE}"
          git checkout -b "$BR"
          git add access.yaml clients.yaml .github/ISSUE_TEMPLATE/
          git commit -m "$TITLE" -m "$SUMMARY" -m "Closes #${ISSUE}" -m "Co-authored-by: ${ISSUE_USER} <${ISSUE_USER_ID}+${ISSUE_USER}@users.noreply.github.com>"
          git push -u origin "$BR"
          url=$(gh pr create --title "$TITLE" --label new-team --body "$(printf 'Request from @%s in #%s.\n\n```\n%s\n```\n\n**Reason:** %s\n\nApprove and merge, and the team is created automatically (see README.md). Check the «Plan» comment below before approving.\n\nCloses #%s' "$ISSUE_USER" "$ISSUE" "$SUMMARY" "$REASON" "$ISSUE")")
          gh issue comment "$ISSUE" --body "Pull request created: $url. Once approved and merged, the team exists and members can be added with the access form."
