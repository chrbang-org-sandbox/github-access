# Merge til main med endret access.yaml -> tilgangene i GitHub oppdateres.
# Dette er det eneste stedet som skriver til orgen. Kjører kun fra main, med kortlevd GitHub App-token.
name: Utfør tilganger
on:
  push:
    branches: [main]
    paths: [access.yaml]
  workflow_dispatch:
    inputs:
      allow_structural:
        description: "Tillat owner-endringer, base permission og sletting av team"
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: github-app
    env: { ORG: "${{ github.repository_owner }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with: { app-id: "${{ secrets.ACCESS_APP_ID }}", private-key: "${{ secrets.ACCESS_APP_PRIVATE_KEY }}", owner: "${{ github.repository_owner }}" }

      - name: Finn PR-en som ble merget, og om strukturendringer er godkjent
        id: pr
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number' 2>/dev/null || true)
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          allow=false
          [ "${{ inputs.allow_structural }}" = "true" ] && allow=true
          if [ -n "$pr" ] && gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx 'godkjent-strukturendring'; then allow=true; fi
          echo "allow_structural=$allow" >> "$GITHUB_OUTPUT"

      - name: Snapshot, plan, apply, verifiser
        id: run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ALLOW: ${{ steps.pr.outputs.allow_structural }}
        run: |
          ./audit.sh
          set +e; tools/plan.py | tee plan.txt; rc=${PIPESTATUS[0]}; set -e
          if [ $rc -eq 0 ]; then echo "Ingen endringer å utføre." > result.txt; exit 0; fi
          [ $rc -eq 2 ] || exit $rc
          tools/apply.py --auto $( [ "$ALLOW" = true ] && echo --allow-structural ) | tee result.txt
          ./audit.sh
          if ! tools/plan.py > verify.txt; then echo "Etter apply er planen fortsatt ikke tom:"; cat verify.txt; exit 1; fi
          echo "Verifisert: config og virkelighet er like." | tee -a result.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: apply-${{ github.run_number }}
          path: |
            snapshots/
            report.html
            plan.txt
            result.txt
            verify.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Rapporter på PR-en
        if: always() && steps.pr.outputs.number != ''
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ steps.pr.outputs.number }}", STATUS: "${{ steps.run.outcome }}" }
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = success ]; then icon="✅ Tilganger oppdatert"; else icon="❌ Apply feilet, ingen eller delvis endring. En owner må se på det."; fi
          gh pr comment "$PR" --body "$(printf '%s\n\n```\n%s\n```\n[Kjøring](%s)' "$icon" "$(cat result.txt 2>/dev/null | tail -60)" "$run_url")"
