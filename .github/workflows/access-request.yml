# Tilgangsforespørsel (issue-skjema) -> pull request mot access.yaml.
# Kjører med et kortlevd GitHub App-token. Kan bare lage branch, PR og kommentar. Kan ikke endre tilgang.
name: Tilgangsforespørsel → PR
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: access-request-${{ github.event.issue.number }}
jobs:
  pr:
    if: contains(github.event.issue.labels.*.name, 'access-request')
    runs-on: ubuntu-latest
    environment: github-app
    env:
      ORG: ${{ github.repository_owner }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }   # ellers overstyrer GITHUB_TOKEN App-tokenet ved push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml

      - name: Les skjemaet
        id: form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: tools/parse-issue.py >> "$GITHUB_OUTPUT"

      - name: Sett tittel på issuet ut fra valgene
        env: { GH_TOKEN: "${{ github.token }}", TITLE: "${{ steps.form.outputs.title }}" }
        run: gh issue edit "$ISSUE" --title "$TITLE"

      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ secrets.ACCESS_APP_ID }}
          private-key: ${{ secrets.ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sjekk at alle er medlem av orgen
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}", LOGINS: "${{ steps.form.outputs.logins }}" }
        run: |
          missing=""
          for l in $LOGINS; do gh api "orgs/$ORG/members/$l" --silent 2>/dev/null || missing="$missing \`$l\`"; done
          if [ -n "$missing" ]; then
            gh issue comment "$ISSUE" --body "❌ Ikke medlem av orgen \`$ORG\`:$missing. Personen må inviteres først. Ingen PR laget."
            exit 1
          fi

      - name: Oppdater access.yaml
        id: edit
        env:
          TEAM: ${{ steps.form.outputs.team }}
          LOGINS: ${{ steps.form.outputs.logins }}
          ACTION: ${{ steps.form.outputs.action }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          summary=""
          for l in $LOGINS; do
            set +e; line=$(tools/request.py --team "$TEAM" --login "$l" --action "$ACTION" 2>&1); rc=$?; set -e
            if [ $rc -ne 0 ]; then gh issue comment "$ISSUE" --body "❌ Kunne ikke lage endring: $line"; exit 1; fi
            summary="${summary}${line}"$'\n'
          done
          { echo "summary<<EOS"; printf '%s' "$summary"; echo "EOS"; } >> "$GITHUB_OUTPUT"

      - name: Branch, commit og pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SUMMARY: ${{ steps.edit.outputs.summary }}
          TITLE: ${{ steps.form.outputs.title }}
          REASON: ${{ steps.form.outputs.reason }}
          TEAM: ${{ steps.form.outputs.team }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_ID: ${{ github.event.issue.user.id }}
        run: |
          git config user.name "github-access[bot]"
          git config user.email "github-access[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BR="request/${TEAM}-${ISSUE}"
          git checkout -b "$BR"
          git add access.yaml
          git commit -m "$TITLE" -m "$SUMMARY" -m "Closes #${ISSUE}" -m "Co-authored-by: ${ISSUE_USER} <${ISSUE_USER_ID}+${ISSUE_USER}@users.noreply.github.com>"
          git push -u origin "$BR"
          url=$(gh pr create --title "$TITLE" --label access-request --body "$(printf 'Forespørsel fra @%s i #%s.\n\n```\n%s```\n\n**Begrunnelse:** %s\n\nGodkjenn og merge, så oppdateres tilgangen automatisk (se FLYT.md). Sjekk «Plan»-kommentaren under før godkjenning.\n\nCloses #%s' "$ISSUE_USER" "$ISSUE" "$SUMMARY" "$REASON" "$ISSUE")")
          gh issue comment "$ISSUE" --body "Pull request laget: $url. Når den er godkjent og merget, oppdateres tilgangen automatisk."
