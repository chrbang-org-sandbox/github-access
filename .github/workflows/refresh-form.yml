# Keeps the user list in the issue form («Who») equal to the org membership. Issue Forms cannot load the list dynamically,
# so it is baked in and refreshed here: daily, manually, and after every apply. Creates a PR only when the list changed.
name: Refresh user list in form
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Apply access"]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: refresh-form
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-app
    env: { ORG: "${{ github.repository_owner }}", BR: chore/refresh-user-list }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with: { app-id: "${{ secrets.ACCESS_APP_ID }}", private-key: "${{ secrets.ACCESS_APP_PRIVATE_KEY }}", owner: "${{ github.repository_owner }}" }

      - name: Regenerate the form with today's org members
        id: gen
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          tools/gen-issue-form.py --users
          if git diff --quiet -- .github/ISSUE_TEMPLATE/access-request.yml; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "User list unchanged."
          else echo "changed=true" >> "$GITHUB_OUTPUT"; git diff -- .github/ISSUE_TEMPLATE/access-request.yml; fi

      - name: Pull request (updates the existing one if it is open)
        if: steps.gen.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          git config user.name "github-access[bot]"
          git config user.email "github-access[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -b "$BR"
          git add .github/ISSUE_TEMPLATE/access-request.yml
          git commit -m "chore(form): refresh user list from org membership"
          git push --force -u origin "$BR"
          if [ -z "$(gh pr list --head "$BR" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "chore(form): refresh user list in the issue form" \
              --body "Org membership changed. The list in the «Who» field of the access form was regenerated with \`tools/gen-issue-form.py --users\`. This PR changes no access."
          fi
