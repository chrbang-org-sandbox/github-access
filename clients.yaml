# Repo -> customer for the sandbox. Generic names; the customers are fictional.
# match = glob on repo name, case-insensitive. Active repos without a match give a warning in tools/plan.py.
# name = team name in GitHub; the team slug is derived (Kunde A -> kunde-a).
clients:
  kunde-a:
    name: Kunde A
    match: [repository-1, repository-2]
  kunde-b:
    name: Kunde B
    match: [repository-3]
  kunde-c:
    name: Kunde C
    match: [repository-4, repository-6]
internal:
  match: [repository-5]
exclude: [github-access]   # platform team only, written by hand in access.yaml
